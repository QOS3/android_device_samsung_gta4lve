name: OrangeFox Recovery Builder

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: 'OrangeFox Manifest Branch'
        required: true
        default: '12.1'
        type: choice
        options:
        - '12.1'
        - '11.0'
        - '10.0'
      DEVICE_TREE:
        description: 'Device Tree URL'
        required: true
        default: 'https://github.com/QOS3/android_device_samsung_gta4lve'
      DEVICE_TREE_BRANCH:
        description: 'Device Tree Branch'
        required: true
        default: 'android-12.1'
      DEVICE_PATH:
        description: 'Device Path (relative to source root)'
        required: true
        default: 'device/samsung/gta4lve'
      DEVICE_NAME:
        description: 'Device Codename'
        required: true
        default: 'gta4lve'
      BUILD_TARGET:
        description: 'Build Target'
        required: true
        default: 'recovery'
        type: choice
        options:
        - recovery
        - boot
        - vendorboot
      RECOVERY_TAR:
        description: 'Create recovery.tar'
        required: false
        default: true
        type: boolean

jobs:
  build:
    name: Build OrangeFox by ${{ github.actor }}
    runs-on: ubuntu-22.04
    if: github.event.repository.owner.id == github.event.sender.id
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
    - name: Check Out
      uses: actions/checkout@v4

    - name: Display Inputs
      run: |
        echo "Manifest Branch : ${{ inputs.MANIFEST_BRANCH }}"
        echo "Device Tree     : ${{ inputs.DEVICE_TREE }}"
        echo "Device Branch   : ${{ inputs.DEVICE_TREE_BRANCH }}"
        echo "Build Target    : ${{ inputs.BUILD_TARGET }}image"

    - name: Cleanup
      uses: rokibhasansagar/slimhub_actions@main

    - name: Set Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 12

    - name: Prepare the environment
      run: |
        sudo apt update
        sudo apt -y upgrade
        sudo apt -y install gperf gcc-multilib gcc-10-multilib g++-multilib g++-10-multilib \
          libc6-dev lib32ncurses5-dev x11proto-core-dev libx11-dev tree lib32z-dev \
          libgl1-mesa-dev libxml2-utils xsltproc bc ccache lib32readline-dev lib32z1-dev \
          liblz4-tool libncurses5-dev libsdl1.2-dev libwxgtk3.0-gtk3-dev libxml2 lzop \
          pngcrush schedtool squashfs-tools imagemagick libbz2-dev lzma ncftp \
          qemu-user-static libstdc++-10-dev libtinfo5 libgflags-dev libncurses5 python3

    - name: Install OpenJDK
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '11'

    - name: Install Git-Repo
      run: |
        mkdir ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/bin/repo

    - name: Initialize OrangeFox Repo
      run: |
        mkdir android-recovery
        cd android-recovery
        git config --global user.name "QOS3"
        git config --global user.email "seefpro11@gmail.com"
        SYNC_BRANCH="${{ inputs.MANIFEST_BRANCH }}"
        SYNC_BRANCH="${SYNC_BRANCH#fox_}"
        repo init --depth=1 \
          -u https://gitlab.com/OrangeFox/sync.git \
          -b ${SYNC_BRANCH}

    - name: Repo Sync
      run: |
        cd android-recovery
        repo sync -j$(nproc --all) --force-sync

    - name: Replace Recovery with Sprd-patched fork
      run: |
        cd android-recovery
        rm -rf bootable/recovery
        git clone https://gitlab.com/qos31/Recovery -b fox_12.1 bootable/recovery

    - name: Clone Device Tree
      run: |
        cd android-recovery
        git clone ${{ inputs.DEVICE_TREE }} \
          -b ${{ inputs.DEVICE_TREE_BRANCH }} \
          ./${{ inputs.DEVICE_PATH }}
        cd ${{ inputs.DEVICE_PATH }}
        echo "COMMIT_ID=$(git rev-parse HEAD)" >> $GITHUB_ENV

    - name: Check Build Makefile
      run: |
        cd android-recovery/${{ inputs.DEVICE_PATH }}
        if [ -f "twrp_${{ inputs.DEVICE_NAME }}.mk" ]; then
            echo "DEVICE_MAKEFILE=twrp_${{ inputs.DEVICE_NAME }}" >> $GITHUB_ENV
        elif [ -f "omni_${{ inputs.DEVICE_NAME }}.mk" ]; then
            echo "DEVICE_MAKEFILE=omni_${{ inputs.DEVICE_NAME }}" >> $GITHUB_ENV
        else
            echo "No recovery makefile found!" && exit 1
        fi

    - name: Building OrangeFox
      run: |
        cd android-recovery
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        export FOX_BUILD_DEVICE=${{ inputs.DEVICE_NAME }}
        export LC_ALL="C"
        lunch ${{ env.DEVICE_MAKEFILE }}-eng && make clean && mka ${{ inputs.BUILD_TARGET }}image -j$(nproc --all)
        echo "Done building ${{ inputs.BUILD_TARGET }}.img"

    - name: Set Build Date
      run: |
        echo "BUILD_DATE=$(date +%Y%m%d)" >> $GITHUB_ENV

    - name: Create recovery.tar
      if: inputs.RECOVERY_TAR == true
      run: |
        cd android-recovery/out/target/product/${{ inputs.DEVICE_NAME }}
        if [ -f "${{ inputs.BUILD_TARGET }}.img" ]; then
          tar -cvf ${{ inputs.BUILD_TARGET }}.tar ${{ inputs.BUILD_TARGET }}.img
          echo "Recovery TAR created"
        fi
      continue-on-error: true

    - name: Upload to Release
      uses: softprops/action-gh-release@master
      with:
        files: |
          android-recovery/out/target/product/${{ inputs.DEVICE_NAME }}/${{ inputs.BUILD_TARGET }}.img
          android-recovery/out/target/product/${{ inputs.DEVICE_NAME }}/${{ inputs.BUILD_TARGET }}.tar
          android-recovery/out/target/product/${{ inputs.DEVICE_NAME }}/OrangeFox*.zip
        name: OrangeFox for ${{ inputs.DEVICE_NAME }} // ${{ env.BUILD_DATE }}
        tag_name: ofox-${{ inputs.DEVICE_NAME }}-${{ env.BUILD_DATE }}-${{ github.run_id }}
        body: |
          ## OrangeFox Recovery
          - **Branch:** ${{ inputs.MANIFEST_BRANCH }}
          - **Device:** [Tree](${{ inputs.DEVICE_TREE }}/tree/${{ inputs.DEVICE_TREE_BRANCH }})
          - **Commit:** [Latest](${{ inputs.DEVICE_TREE }}/commit/${{ env.COMMIT_ID }})
          - **Built by:** @${{ github.actor }}

          ## Flash Instructions
          - Samsung: flash `.tar` via Odin
          - Generic: flash `.img` via `fastboot flash recovery`
