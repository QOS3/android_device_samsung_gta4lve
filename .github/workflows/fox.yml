name: OrangeFox [OFRP] 12.1

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: 'OrangeFox Manifest Branch'
        required: true
        default: '12.1'
        type: choice
        options:
        - 12.1
        - 11.0
        - 10.0
        - 9.0
      DEVICE_TREE:
        description: 'Custom Recovery Tree'
        required: true
        default: 'https://github.com/DevCat3/android_device_samsung_gta4lve'
      DEVICE_TREE_BRANCH:
        description: 'Custom Recovery Tree Branch'
        required: true
        default: 'fox_12.1'
      BUILD_TARGET:
        description: 'Specify your Build Target'
        required: true
        default: 'recovery'
        type: choice
        options:
        - boot
        - recovery
        - vendorboot
      LDCHECK:
        description: 'Use LDCHECK'
        required: false
        default: 'false'
        type: boolean
      LDCHECKPATH:
        description: 'Path of blobs to check'
        required: true
        default: 'system/bin/qseecomd'
      RECOVERY_TAR:
        description: 'Create recovery.tar (Samsung devices)'
        required: false
        default: false
        type: boolean

jobs:
  build:
    name: Build OFRP by ${{ github.actor }}
    runs-on: ubuntu-22.04
    if: github.event.repository.owner.id == github.event.sender.id
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      USER_NAME: "DevCat3"
      USER_EMAIL: "omarelbakery2008@gmail.com"
    permissions:
      contents: write
    steps:
    - name: Check Out Repository
      uses: actions/checkout@v3

    - name: Display User Inputs
      run: |
        echo "::group::User Environment Variables"
        echo "🦊 OrangeFox Branch: ${{ inputs.MANIFEST_BRANCH }}"
        echo "🌳 Device Tree: ${{ inputs.DEVICE_TREE }}"
        echo "📂 Device Branch: ${{ inputs.DEVICE_TREE_BRANCH }}"
        echo "🎯 Build Target: ${{ inputs.BUILD_TARGET }}image"
        echo "::endgroup::"

    - name: Map OrangeFox Branch to TWRP Manifest Branch
      run: |
        FOX_BRANCH="${{ inputs.MANIFEST_BRANCH }}"
        case "$FOX_BRANCH" in
          "12.1") MANIFEST_BRANCH="twrp-12.1" && JAVA_VERSION="11" ;;
          "11.0") MANIFEST_BRANCH="twrp-11"   && JAVA_VERSION="11" ;;
          "10.0") MANIFEST_BRANCH="twrp-10"   && JAVA_VERSION="8"  ;;
          "9.0")  MANIFEST_BRANCH="twrp-9"    && JAVA_VERSION="8"  ;;
          *)      MANIFEST_BRANCH="twrp-12.1" && JAVA_VERSION="11" ;;
        esac
        echo "✅ OrangeFox fox_${FOX_BRANCH} → TWRP Manifest: ${MANIFEST_BRANCH}"
        echo "MANIFEST_BRANCH=${MANIFEST_BRANCH}" >> $GITHUB_ENV
        echo "FOX_BRANCH=${FOX_BRANCH}"           >> $GITHUB_ENV
        echo "JAVA_VERSION=${JAVA_VERSION}"        >> $GITHUB_ENV

    - name: Cleanup Workspace
      uses: rokibhasansagar/slimhub_actions@main

    - name: Set Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 24

    - name: Prepare Build Environment
      run: |
        sudo apt update
        sudo apt -y upgrade
        sudo apt -y install gperf gcc-multilib gcc-10-multilib g++-multilib g++-10-multilib \
          lib32ncurses5-dev x11proto-core-dev lib32z-dev libgl1-mesa-dev libxml2-utils xsltproc \
          bc ccache lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libsdl1.2-dev \
          libwxgtk3.0-gtk3-dev lzop pngcrush schedtool squashfs-tools imagemagick libbz2-dev \
          lzma ncftp qemu-user-static libstdc++-10-dev libtinfo5 libgflags-dev aria2
        sudo add-apt-repository universe -y
        sudo apt -y install libncurses5

    - name: Install Java (Dynamic Version)
      uses: actions/setup-java@v4
      with:
        distribution: zulu
        java-version: ${{ env.JAVA_VERSION }}

    - name: Install Git-Repo Tool
      run: |
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/bin/repo

    - name: Initialize Repo with TWRP Manifest
      run: |
        mkdir -p workspace
        cd workspace
        git config --global user.name "${{ env.USER_NAME }}"
        git config --global user.email "${{ env.USER_EMAIL }}"
        repo init --depth=1 \
          -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git \
          -b ${{ env.MANIFEST_BRANCH }}

    - name: Sync Repository
      run: |
        cd workspace
        repo sync -j$(nproc --all) --force-sync

    - name: Replace bootable/recovery with OrangeFox Source
      run: |
        cd workspace
        rm -rf bootable/recovery
        git clone https://gitlab.com/OrangeFox/bootable/recovery \
          -b fox_${{ env.FOX_BRANCH }} bootable/recovery --depth=1
        echo "✅ Using OrangeFox bootable/recovery (fox_${{ env.FOX_BRANCH }})"

    - name: Clone Device Tree
      run: |
        cd workspace
        git clone ${{ inputs.DEVICE_TREE }} \
          -b ${{ inputs.DEVICE_TREE_BRANCH }} \
          ./device_tree --depth=1
        cd device_tree
        echo "COMMIT_ID=$(git rev-parse HEAD)" >> $GITHUB_ENV

    - name: Extract Variables from .mk File
      run: |
        cd workspace/device_tree
        DEVICE_MAKEFILE=""
        DEVICE_DIRECTORY=""
        DEVICE_NAME=""
        for file in *.mk; do
            makefile=$(sed -n 's/^[[:space:]]*PRODUCT_NAME[[:space:]]*:=\s*\(.*\)/\1/p' "$file")
            brand=$(sed -n 's/^[[:space:]]*PRODUCT_BRAND[[:space:]]*:=\s*\(.*\)/\1/p' "$file")
            codename=$(sed -n 's/^[[:space:]]*PRODUCT_DEVICE[[:space:]]*:=\s*\(.*\)/\1/p' "$file")
            if [[ -n "$makefile" && -n "$brand" && -n "$codename" ]]; then
                DEVICE_MAKEFILE="$makefile"
                DEVICE_DIRECTORY="device/$brand"
                DEVICE_NAME="$codename"
                echo "DEVICE_MAKEFILE=${DEVICE_MAKEFILE}" >> $GITHUB_ENV
                echo "DEVICE_NAME=${DEVICE_NAME}"         >> $GITHUB_ENV
                echo "DEVICE_DIRECTORY=${DEVICE_DIRECTORY}" >> $GITHUB_ENV
                break
            fi
        done
        cd ../
        echo "Creating directory: $DEVICE_DIRECTORY"
        mkdir -p "$DEVICE_DIRECTORY"
        echo "Moving device_tree → $DEVICE_DIRECTORY/$DEVICE_NAME"
        mv device_tree "$DEVICE_DIRECTORY"/"$DEVICE_NAME"

    - name: Install Python 2 (for legacy branches)
      if: contains(env.MANIFEST_BRANCH, 'twrp-9') || contains(env.MANIFEST_BRANCH, 'twrp-10')
      run: |
        sudo apt -y install python2
        sudo ln -sf /usr/bin/python2 /usr/bin/python
        echo "✅ Python 2 installed for ${{ env.MANIFEST_BRANCH }}"

    - name: Build OrangeFox Recovery
      run: |
        cd workspace
        set +e
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        set -e
        lunch twrp_${{ env.DEVICE_NAME }}-eng
        make clean
        mka adbd ${{ inputs.BUILD_TARGET }}image -j$(nproc --all)
        echo "✅ Build complete!"

    - name: Set Build Date
      run: |
        echo "BUILD_DATE=$(date +%Y%m%d)" >> $GITHUB_ENV
        DEVICE_TREE_URL="${{ inputs.DEVICE_TREE }}"
        if [[ "${DEVICE_TREE_URL}" == *.git ]]; then
          DEVICE_TREE_URL="${DEVICE_TREE_URL%.git}"
        fi
        echo "DEVICE_TREE_URL=${DEVICE_TREE_URL}" >> $GITHUB_ENV

    - name: Check if Recovery Image Exists
      run: |
        cd workspace
        PRODUCT_PATH="out/target/product/${{ env.DEVICE_NAME }}"

        # OrangeFox produces its own named image
        if [ -f "$PRODUCT_PATH"/OrangeFox*.img ]; then
            echo "CHECK_IMG_IS_OK=true" >> $GITHUB_ENV
            echo "MD5_IMG=$(md5sum $PRODUCT_PATH/OrangeFox*.img | cut -d ' ' -f 1)" >> $GITHUB_ENV
        elif [ -f "$PRODUCT_PATH/${{ inputs.BUILD_TARGET }}.img" ]; then
            echo "CHECK_IMG_IS_OK=true" >> $GITHUB_ENV
            echo "MD5_IMG=$(md5sum $PRODUCT_PATH/${{ inputs.BUILD_TARGET }}.img | cut -d ' ' -f 1)" >> $GITHUB_ENV
        else
            echo "❌ No recovery image found!"
            exit 1
        fi

        if [ -f "$PRODUCT_PATH"/OrangeFox*.zip ]; then
            echo "CHECK_ZIP_IS_OK=true" >> $GITHUB_ENV
            echo "MD5_ZIP=$(md5sum $PRODUCT_PATH/OrangeFox*.zip | cut -d ' ' -f 1)" >> $GITHUB_ENV
        fi

    - name: Create Samsung TAR (Optional)
      if: inputs.RECOVERY_TAR == 'true'
      run: |
        cd workspace/out/target/product/${{ env.DEVICE_NAME }}/
        IMG=$(ls OrangeFox*.img 2>/dev/null || echo "${{ inputs.BUILD_TARGET }}.img")
        tar -cvf recovery.tar "$IMG"
        echo "✅ Created recovery.tar"
      continue-on-error: true

    - name: Upload to GitHub Release
      if: env.CHECK_IMG_IS_OK == 'true'
      uses: softprops/action-gh-release@v1
      with:
        files: |
          workspace/out/target/product/${{ env.DEVICE_NAME }}/OrangeFox*.img
          workspace/out/target/product/${{ env.DEVICE_NAME }}/OrangeFox*.zip
          workspace/out/target/product/${{ env.DEVICE_NAME }}/OrangeFox*.img.tar
          workspace/out/target/product/${{ env.DEVICE_NAME }}/recovery.tar
          workspace/out/target/product/${{ env.DEVICE_NAME }}/ramdisk-recovery.*
        name: "OrangeFox fox_${{ env.FOX_BRANCH }} for ${{ env.DEVICE_NAME }} // ${{ env.BUILD_DATE }}"
        tag_name: "ofrp-fox_${{ env.FOX_BRANCH }}-${{ env.DEVICE_NAME }}-${{ env.BUILD_DATE }}-${{ github.run_id }}"
        body: |
          ## Build Information
          - 🦊 **OrangeFox Branch:** fox_${{ env.FOX_BRANCH }}
          - 📦 **Manifest:** minimal-manifest-twrp (${{ env.MANIFEST_BRANCH }})
          - 🎯 **Target:** ${{ inputs.BUILD_TARGET }}.img
          - 🌳 **Device Tree:** [${{ inputs.DEVICE_TREE_BRANCH }}](${{ env.DEVICE_TREE_URL }}/tree/${{ inputs.DEVICE_TREE_BRANCH }})
          - 🔖 **Commit:** [Latest commit](${{ env.DEVICE_TREE_URL }}/commit/${{ env.COMMIT_ID }}) during build
          - 🔢 **MD5 (img):** `${{ env.MD5_IMG }}`
          - 🔢 **MD5 (zip):** `${{ env.MD5_ZIP }}`
          - 🏗️ **Built by:** @${{ github.actor }}
          - 🔁 **Recovery Source:** [OrangeFox/bootable/recovery](https://gitlab.com/OrangeFox/bootable/recovery/-/tree/fox_${{ env.FOX_BRANCH }})

    - name: Run LDCheck
      if: inputs.LDCHECK == 'true'
      run: |
        if [ -d "tools" ] && [ -f "tools/libneeds" ] && [ -f "tools/ldcheck" ]; then
          cd tools
          mv -n libneeds ${GITHUB_WORKSPACE}/workspace/out/target/product/${{ env.DEVICE_NAME }}/recovery/root/
          mv -n ldcheck  ${GITHUB_WORKSPACE}/workspace/out/target/product/${{ env.DEVICE_NAME }}/recovery/root/
          cd ${GITHUB_WORKSPACE}/workspace/out/target/product/${{ env.DEVICE_NAME }}/recovery/root
          python3 ldcheck -p system/lib64:vendor/lib64:system/lib:vendor/lib -d ${{ inputs.LDCHECKPATH }}
          echo "✅ Dependency check completed"
        else
          echo "⚠️ ldcheck tools not found, skipping"
        fi
      continue-on-error: true
